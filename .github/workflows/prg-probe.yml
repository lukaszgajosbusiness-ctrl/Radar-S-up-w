name: PRG probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          curl -sSL -m 120 -o a.zip "https://integracja.gugik.gov.pl/PRG/pobierz.php?teryt=2416&adresy" -w "%{http_code} %{size_download} %{content_type}\n" || true
          file a.zip; unzip -l a.zip | head -20 || head -c 600 a.zip
          curl -sS -m 60 "https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaNumeracjiAdresowej?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ms:prg-adresy&COUNT=2&BBOX=50.45,19.05,50.47,19.08,urn:ogc:def:crs:EPSG::4326" | head -c 2500 || true
          curl -sS -m 60 "https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaNumeracjiAdresowej?SERVICE=WFS&REQUEST=GetCapabilities" | grep -o "<Name>[^<]*</Name>" | head || true
