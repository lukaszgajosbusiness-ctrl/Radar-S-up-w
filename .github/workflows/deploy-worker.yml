name: Wdrożenie serwera (Cloudflare)
on:
  push:
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Brak sekretu CLOUDFLARE_API_TOKEN" && exit 1)
          ID=$(npx -y wrangler@3 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(d=>d.name==="radar-slupow");console.log(x?x.uuid:"")})')
          if [ -z "$ID" ]; then npx -y wrangler@3 d1 create radar-slupow; ID=$(npx -y wrangler@3 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);console.log(a.find(d=>d.name==="radar-slupow").uuid)})'); fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx -y wrangler@3 d1 execute radar-slupow --remote --file schema.sql -y
          npx -y wrangler@3 deploy 2>&1 | tee deploy.log
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx -y wrangler@3 secret put BOOTSTRAP
          grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1 > url.txt || true
      - name: Zapisz adres serwera
        run: |
          U=$(cat worker/url.txt); test -n "$U" || exit 0
          echo "{\"api\":\"$U\"}" > data/api.json
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data/api.json; git diff --cached --quiet || (git commit -m "Adres serwera API [skip ci]" && git pull --rebase -q && git push)
    permissions:
      contents: write
