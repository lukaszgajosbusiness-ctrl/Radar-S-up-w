name: Przeliczanie obszarów (Radar Słupów)
on:
  schedule:
    - cron: '17 1 * * *'   # codziennie ok. 2:17–3:17 czasu PL
  workflow_dispatch:
    inputs:
      only:
        description: 'Tylko jeden obszar (slug z scripts/areas.json), puste = wszystkie'
        required: false
  push:
    paths: ['scripts/areas.json', 'scripts/precompute.mjs']
permissions:
  contents: write
concurrency: { group: precompute, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/precompute.mjs
        env: { ONLY_AREA: '${{ github.event.inputs.only }}' }
      - name: Zapisz wyniki
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Dane: przeliczenie obszarów $(date -u +%F)" && git pull --rebase -q && git push)
