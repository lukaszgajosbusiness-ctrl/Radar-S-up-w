name: Przeliczanie obszarów (Radar Słupów)
on:
  schedule:
    - cron: '17 1 * * *'   # codziennie ok. 2:17–3:17 czasu PL
  workflow_dispatch:
    inputs:
      only:
        description: 'Tylko jeden obszar (slug z scripts/areas.json), puste = wszystkie'
        required: false
permissions:
  contents: write
concurrency: { group: precompute, cancel-in-progress: false }
jobs:
  list:
    runs-on: ubuntu-latest
    outputs: { slugs: '${{ steps.s.outputs.slugs }}' }
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then echo 'slugs=["${{ github.event.inputs.only }}"]' >> $GITHUB_OUTPUT
          else echo "slugs=$(node -e "console.log(JSON.stringify(require('./scripts/areas.json').map(a=>a.slug)))")" >> $GITHUB_OUTPUT; fi
  run:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: { slug: '${{ fromJson(needs.list.outputs.slugs) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/precompute.mjs
        env: { ONLY_AREA: '${{ matrix.slug }}' }
      - name: Wynik obszaru
        run: mkdir -p out && if [ -f data/${{ matrix.slug }}.json ] && ! git diff --quiet -- data/${{ matrix.slug }}.json 2>/dev/null || [ -n "$(git status --porcelain data/${{ matrix.slug }}.json)" ]; then cp data/${{ matrix.slug }}.json out/; fi; ls out
      - uses: actions/upload-artifact@v4
        with: { name: 'area-${{ matrix.slug }}', path: out, if-no-files-found: ignore }
  commit:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'area-*', merge-multiple: true }
      - name: Zapisz wyniki
        run: |
          mkdir -p art; cp art/*.json data/ 2>/dev/null || true
          node scripts/build_index.mjs
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Dane: przeliczenie obszarów $(date -u +%F)" && git pull --rebase -q && git push)
