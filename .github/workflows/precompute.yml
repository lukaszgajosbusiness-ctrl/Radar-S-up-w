name: Przeliczanie obszarów (Radar Słupów)
on:
  schedule:
    - cron: '17 1 * * *'   # codziennie ok. 2:17–3:17 czasu PL
  workflow_dispatch:
    inputs:
      only:
        description: 'Obszary po przecinku (slugi z scripts/areas.json), puste = nowe obszary bez danych; „wszystkie” = pełne odświeżenie'
        required: false
permissions:
  contents: write
concurrency: { group: precompute, cancel-in-progress: false }
jobs:
  list:
    runs-on: ubuntu-latest
    outputs: { slugs: '${{ steps.s.outputs.slugs }}' }
    steps:
      - uses: actions/checkout@v4
      - id: s
        env: { ONLY: '${{ github.event.inputs.only }}' }
        run: |
          # ręcznie: podane slugi; wszystkie = pełne odświeżenie (max 250 – limit macierzy GitHuba);
          # automatycznie: nowe obszary bez danych (max 200 na raz), a w poniedziałek odświeżenie istniejących
          echo "slugs=$(node -e "
          const fs=require('fs'),A=require('./scripts/areas.json').map(a=>a.slug),o=(process.env.ONLY||'').trim();
          const has=s=>fs.existsSync('data/'+s+'.json');let r;
          if(o==='wszystkie')r=A.slice(0,250);
          else if(o)r=o.split(',').map(x=>x.trim()).filter(Boolean);
          else{const miss=A.filter(s=>!has(s));r=miss.length?miss.slice(0,200):(new Date().getUTCDay()===1?A.filter(has).slice(0,250):[])}
          console.log(JSON.stringify(r))")" >> $GITHUB_OUTPUT
  run:
    needs: list
    if: needs.list.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: { slug: '${{ fromJson(needs.list.outputs.slugs) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/precompute.mjs
        env: { ONLY_AREA: '${{ matrix.slug }}' }
      - name: Wynik obszaru
        run: mkdir -p out && if [ -f data/${{ matrix.slug }}.json ] && ! git diff --quiet -- data/${{ matrix.slug }}.json 2>/dev/null || [ -n "$(git status --porcelain data/${{ matrix.slug }}.json)" ]; then cp data/${{ matrix.slug }}.json out/; fi; mkdir -p out/cache; cp data/cache/${{ matrix.slug }}-*.json out/cache/ 2>/dev/null || true; ls -R out
      - uses: actions/upload-artifact@v4
        with: { name: 'area-${{ matrix.slug }}', path: out, if-no-files-found: ignore }
  commit:
    needs: [list, run]
    if: always() && needs.list.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'area-*', merge-multiple: true }
      - name: Zapisz wyniki
        run: |
          mkdir -p art data/cache; cp art/*.json data/ 2>/dev/null || true; cp art/cache/*.json data/cache/ 2>/dev/null || true
          node scripts/build_index.mjs
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Dane: przeliczenie obszarów $(date -u +%F)" && git pull --rebase -q && git push)
