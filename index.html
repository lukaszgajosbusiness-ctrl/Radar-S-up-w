<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Słupów</title>
<meta name="theme-color" content="#14324a">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Układ: mapa na górze, lista działek pod spodem (telefon) / mapa obok listy (komputer) */
:root{--bg:#f3f5f7;--panel:#fff;--fg:#14202b;--mute:#5d6b78;--line:#d9e0e6;--acc:#14324a;--nn:#b0182b;--wn:#e0561b;--sn:#d4a20d;--nnN:#7d8a96;--gaz:#c9a400;--woda:#1c6fd1;--ok:#1f8a4c;--warn:#b86e00;
--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f161c;--panel:#17212a;--fg:#e6edf3;--mute:#93a3b1;--line:#2a3743;--acc:#8fc1ea;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px max(12px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));background:var(--acc);color:#fff}
header h1{font-size:16px;margin:0 8px 0 0;letter-spacing:.02em}
header input,header select,header button{font:inherit;padding:6px 8px;border-radius:6px;border:0}
header input{width:160px}
button{cursor:pointer;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button.pri{background:#ffb703;color:#14202b;border:0;font-weight:600}
#main{flex:1;display:flex;min-height:0}
#map{flex:1.3;min-height:300px}
#side{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);background:var(--panel)}
@media (max-width:800px){#main{flex-direction:column}#map{flex:none;height:48vh}#side{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:800px){header{gap:6px;padding-block:6px}header h1{font-size:15px;width:100%}header input{flex:1;min-width:0}header button,header select{padding:9px 10px;font-size:14px}header #gotowe{flex:1 1 100%}#card .btns button,#card select,#card input{min-height:42px;font-size:15px}.row{padding:12px}#filters{font-size:14px}#filters label{padding:4px 0}}
 #card{box-sizing:border-box;width:100%}#card table{table-layout:fixed}#card td{overflow-wrap:anywhere}#card input,#card select,#card textarea{box-sizing:border-box;max-width:100%}
#moreBtn{display:none}
@media (max-width:800px){#moreBtn{display:inline-block}header.short .extra{display:none}#map{height:42vh}}
.locbtn{background:#fff;border:2px solid rgba(0,0,0,.2);border-radius:4px;width:34px;height:34px;font-size:18px;line-height:30px;text-align:center;cursor:pointer}
#status{padding:8px 12px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
#bar{height:3px;background:var(--line)}#bar i{display:block;height:3px;width:0;background:#ffb703;transition:width .2s}
#filters{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
#list{flex:1;overflow:auto}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.rk{font:600 13px var(--mono);color:var(--mute);grid-row:span 2;align-self:center;width:2.2em}
.nm{font-weight:600}.sc{font:600 14px var(--mono);text-align:right}
.tags{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.t{font-size:11.5px;padding:1px 6px;border-radius:10px;color:#fff;white-space:nowrap}
.t.NN{background:var(--nn)}.t.WN{background:var(--wn)}.t.SN{background:var(--sn);color:#222}.t.nN{background:var(--nnN)}.t.gaz{background:var(--gaz);color:#222}.t.woda{background:var(--woda)}
.t.f{background:transparent;color:var(--fg);border:1px solid var(--line)}.t.dom{background:var(--ok)}.t.x{background:transparent;color:var(--warn);border:1px solid var(--warn)}
#card{position:fixed;inset:auto 0 0 0;max-height:85vh;overflow:auto;background:var(--panel);border-top:2px solid var(--acc);padding:14px max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-bottom));z-index:1000;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
@media (min-width:801px){#card{inset:60px 0 auto auto;width:440px;max-height:calc(100% - 70px);border:1px solid var(--line);border-top:2px solid var(--acc)}}
#card h2{margin:0 0 4px;font-size:17px}
#card table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
#card td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}#card td:first-child{color:var(--mute);width:44%}
#card input,#card select,#card textarea{font:inherit;width:100%;padding:5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
.calc{background:color-mix(in srgb,#ffb703 14%,var(--panel));border-radius:8px;padding:6px 10px;margin:10px 0}
.calc b{font-family:var(--mono)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{font-size:12px;color:var(--mute)}
.leaflet-container{background:#dde3e8}
</style>
</head>
<body>
<header class="short">
  <h1>Radar Słupów</h1>
  <input id="q" value="Tuliszów, Siewierz" aria-label="Miejscowość lub gmina">
  <select id="rad" aria-label="Promień"><option value="800">0,8 km</option><option value="1500" selected>1,5 km</option><option value="2500">2,5 km</option><option value="4000">4 km</option></select>
  <button class="pri" id="go">Szukaj działek</button>
  <button id="goView" class="extra" title="Szukaj w obszarze widocznym na mapie">W widoku mapy</button>
  <select id="gotowe" aria-label="Gotowe obszary" hidden><option value="">Gotowe obszary…</option></select>
  <button id="demoBtn" class="extra" hidden>Przykładowy lead</button>
  <button id="nrBtn" class="extra">Po numerze</button>
  <button id="csv" class="extra">CSV</button>
  <button id="kontoBtn">Konto</button>
  <button id="moreBtn" aria-label="Więcej opcji">⋯ Więcej</button>
</header>
<div id="main">
  <div id="map"></div>
  <div id="side">
    <div id="bar"><i></i></div>
    <div id="status">Wpisz miejscowość i kliknij „Szukaj działek”. Dane: OpenStreetMap (sieci, budynki, lasy) + ULDK GUGiK (działki).</div>
    <div id="filters">
      <label><input type="checkbox" id="fOk" checked> tylko spełniające odległość od granicy</label>
      <label><input type="checkbox" id="fNn"> pokaż nN 0,4 kV</label>
      <label><input type="checkbox" id="fLas" checked> ukryj lasy</label>
      <label><input type="checkbox" id="fDom"> tylko z budynkiem przy linii</label>
      <label><input type="checkbox" id="fMoje"> tylko moje (status/notatka)</label>
      <label><input type="checkbox" id="fNear"> sortuj: najbliżej mnie</label>
    </div>
    <div id="list"></div>
  </div>
</div>
<div id="nrPanel" hidden style="position:fixed;z-index:1100;inset:70px 12px auto auto;width:min(420px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--acc);border-radius:8px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)">
  <b>Sprawdź działki po numerze</b>
  <p class="note" style="margin:4px 0 8px">Jedna działka w linii: obręb i numer (np. <code>Tuliszów 90</code>, <code>Przeczyce 223/1</code>) albo pełny identyfikator (<code>240107_5.0010.90</code>).</p>
  <textarea id="nrList" rows="6" style="width:100%;font:13px var(--mono);padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)" placeholder="Tuliszów 90&#10;Przeczyce 223/1"></textarea>
  <label class="note" style="display:block;margin:6px 0">Gmina (gdy obręb jest w kilku gminach): <input id="nrGm" placeholder="np. Siewierz" style="width:100%;padding:5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)"></label>
  <div class="btns"><button class="pri" id="nrGo">Sprawdź działki</button><button id="nrX">Zamknij</button></div>
</div>
<div id="kontoPanel" hidden style="position:fixed;z-index:1100;inset:70px 12px auto auto;width:min(420px,calc(100% - 24px));max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--acc);border-radius:8px;padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)"></div>
<div id="card" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('rs:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('rs:'+k,JSON.stringify(v));return true}catch(e){return false}}};

// ---------- mapa ----------
const map=L.map('map',{zoomControl:true}).setView([50.4336,19.1946],14);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const orto=L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution',{layers:'Raster',format:'image/jpeg',maxZoom:20,attribution:'Ortofoto © GUGiK'});
const wms=(url,layers,o={})=>L.tileLayer.wms(url,Object.assign({layers,format:'image/png',transparent:true,version:'1.3.0',maxZoom:20,minZoom:13},o));
const ewid=wms('https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow','dzialki,numery_dzialek',{attribution:'EGiB © GUGiK'});
const kiut=wms('https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaUzbrojeniaTerenu','przewod_elektroenergetyczny,przewod_gazowy,przewod_wodociagowy,przewod_cieplowniczy,przewod_kanalizacyjny',{attribution:'KIUT © GUGiK'});
const mpzp=wms('https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaMiejscowychPlanowZagospodarowaniaPrzestrzennego','plany,plany_granice',{opacity:.6,attribution:'MPZP © GUGiK'});
const gNet=L.layerGroup().addTo(map),gPar=L.layerGroup().addTo(map),gPin=L.layerGroup().addTo(map),gArea=L.layerGroup().addTo(map);
L.control.layers({'Mapa OSM':osm,'Ortofotomapa':orto},{'Działki (EGiB)':ewid,'Uzbrojenie terenu (KIUT)':kiut,'Plany miejscowe (MPZP)':mpzp,'Sieci z OSM':gNet,'Działki z siecią':gPar,'Top 20':gPin},{collapsed:true}).addTo(map);

// ---------- geometria (metry lokalne) ----------
let K={lat0:50.43,kx:71000,ky:110540};
const setK=lat=>{K={lat0:lat,kx:111320*Math.cos(lat*Math.PI/180),ky:110540}};
const M=([lon,lat])=>[lon*K.kx,lat*K.ky];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function inRing(p,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[a,b]=r[i],[cx,cy]=r[j];if((b>p[1])!=(cy>p[1])&&p[0]<(cx-a)*(p[1]-b)/(cy-b)+a)c=!c}return c}
const inRings=(p,rs)=>{let c=0;for(const r of rs)if(inRing(p,r))c^=1;return !!c};
function dSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
const dRings=(p,rs)=>{let m=1e9;for(const r of rs)for(let i=0;i<r.length-1;i++)m=Math.min(m,dSeg(p,r[i],r[i+1]));return m};
const dLine=(p,g)=>{let m=1e9;for(let i=0;i<g.length-1;i++)m=Math.min(m,dSeg(p,g[i],g[i+1]));return m};
function wktRings(w){return [...w.replace(/^SRID=\d+;/,'').matchAll(/\(([-\d\. ,]+)\)/g)].map(m=>m[1].split(',').map(s=>s.trim().split(/\s+/).map(Number)))}
const areaM2=rs=>rs.reduce((A,r)=>{const m=r.map(M);let s=0;for(let i=0;i<m.length-1;i++)s+=m[i][0]*m[i+1][1]-m[i+1][0]*m[i][1];return A+Math.abs(s)/2},0);

// ---------- klasyfikacja sieci ----------
const TYPES={NN:{w:5,c:'--nn',n:'linia NN (najwyższe napięcie)'},WN:{w:4,c:'--wn',n:'linia WN (wysokie napięcie)'},gaz:{w:4,c:'--gaz',n:'gazociąg'},SN:{w:3,c:'--sn',n:'linia SN (średnie napięcie)'},woda:{w:2,c:'--woda',n:'wodociąg magistralny'},nN:{w:1,c:'--nnN',n:'linia nN 0,4 kV'}};
function classify(t){
  if(t.man_made==='pipeline'){const s=(t.substance||t.type||'').toLowerCase();if(s.includes('gas'))return 'gaz';if(s.includes('water'))return 'woda';return null}
  const v=Math.max(0,...String(t.voltage||'').split(';').map(Number).filter(n=>!isNaN(n)));
  if(v>=220000)return 'NN';if(v>=60000)return 'WN';if(v>=1000)return 'SN';if(v>0)return 'nN';
  return t.power==='line'?'WN':'SN'; // brak napięcia w OSM: line ≈ WN, minor_line ≈ SN (do sprawdzenia)
}
const kind=t=>(t.power==='cable'||t.location==='underground'||(t.man_made==='pipeline'&&t.location!=='overground'))?'podziemna':'napowietrzna';
const col=k=>getComputedStyle(document.documentElement).getPropertyValue(TYPES[k].c).trim();

// ---------- pobieranie ----------
const status=(t,p)=>{$('#status').textContent=t;if(p!=null)$('#bar i').style.width=Math.round(p*100)+'%'};
async function overpass(bb,tmo=100000){
  const ck='ov:'+[bb.s,bb.w,bb.n,bb.e].map(v=>v.toFixed(3)).join(',');
  try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&Date.now()-c.t<7*864e5){return c.e}}catch(e){}
  // większy obszar z pamięci, który obejmuje ten
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith('ov:'))continue;const[s,w,n,e]=k.slice(3).split(',').map(Number);if(s<=bb.s+.0025&&w<=bb.w+.004&&n>=bb.n-.0025&&e>=bb.e-.004){const c=JSON.parse(localStorage.getItem(k));if(c&&Date.now()-c.t<7*864e5)return c.e}}}catch(e){}
  const els=await overpassNet(bb,tmo);try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),e:els}))}catch(e){}
  return els;
}
async function overpassNet(bb,tmo=100000){
  const b=`(${bb.s},${bb.w},${bb.n},${bb.e})`;
  const q=`[out:json][timeout:120];(way["power"~"^(line|minor_line|cable)$"]${b};way["man_made"="pipeline"]${b};)->.n;(.n;way(around.n:15)["landuse"="forest"];way(around.n:15)["natural"="wood"];node(around.n:3)["power"~"^(tower|pole)$"];);out tags geom;`;
  for(const host of['https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter']){
    try{status('Pobieram sieci z OpenStreetMap ('+new URL(host).host+')…',.05);const r=await fetch(host,{method:'POST',body:'data='+encodeURIComponent(q),signal:AbortSignal.timeout(tmo)});if(r.ok)return (await r.json()).elements}catch(e){}
  }throw new Error('Overpass (OpenStreetMap) nie odpowiada. Spróbuj za minutę.');
}
async function uldkXY(lon,lat){
  const r=await fetch(`https://uldk.gugik.gov.pl/?request=GetParcelByXY&xy=${lon},${lat},4326&result=id,parcel,region,commune,county,geom_wkt&srid=4326`);
  const l=(await r.text()).trim().split('\n');if(l[0]!=='0')return null;
  const [id,num,obr,gm,pow,wkt]=l[1].split('|');return{id,num,obr,gm,pow,wkt};
}
async function pool(items,n,fn,onp){let i=0,done=0;await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const k=i++;try{await fn(items[k])}catch(e){}onp(++done)}}))}

// ---------- analiza ----------
let RES=[],NETS=[],AREA=null;
async function run(bb,label){
  $('#card').hidden=true;gNet.clearLayers();gPar.clearLayers();gPin.clearLayers();gArea.clearLayers();$('#list').innerHTML='';
  setK((bb.s+bb.n)/2);AREA={bb,label};
  gArea.addLayer(L.rectangle([[bb.s,bb.w],[bb.n,bb.e]],{color:'#ffb703',weight:1,fill:false,dashArray:'4 4'}));
  status('Pobieram sieci, budynki i lasy z OpenStreetMap…',.05);
  const els=await overpass(bb);
  const nets=[],blds=[],forests=[],poles=[];
  for(const e of els){
    if(e.type==='node'){poles.push(M([e.lon,e.lat]));continue}
    if(!e.geometry)continue;const g=e.geometry.map(p=>[p.lon,p.lat]);const t=e.tags||{};
    if(t.building){const m=g.map(M);let cx=0,cy=0;m.forEach(p=>{cx+=p[0];cy+=p[1]});blds.push({c:[cx/m.length,cy/m.length],t});continue}
    if(t.landuse==='forest'||t.natural==='wood'){forests.push(g.map(M));continue}
    const k=classify(t);if(!k)continue;
    nets.push({id:e.id,k,kind:kind(t),t,g,m:g.map(M)});
  }
  NETS=nets;
  for(const n of nets)gNet.addLayer(L.polyline(n.g.map(([x,y])=>[y,x]),{color:col(n.k),weight:n.k==='NN'?5:n.k==='WN'?4:n.k==='nN'?1.5:2.5,dashArray:n.kind==='podziemna'?'6 5':null}).bindTooltip(`${TYPES[n.k].n}${n.t.voltage?' '+(+n.t.voltage.split(';')[0]/1000)+' kV':''} · ${n.t.operator||'operator ?'}`));
  // próbki co 15 m wzdłuż sieci (bez nN, chyba że zaznaczone)
  const useNn=$('#fNn').checked, inBB=([x,y])=>x>bb.w&&x<bb.e&&y>bb.s&&y<bb.n;
  const pts=[];
  for(const n of nets){if(n.k==='nN'&&!useNn)continue;const g=n.g;
    for(let i=0;i<g.length-1;i++){const L_=dist(M(g[i]),M(g[i+1]));const s=Math.max(1,Math.ceil(L_/15));for(let k=0;k<s;k++){const t=k/s;const p=[g[i][0]+(g[i+1][0]-g[i][0])*t,g[i][1]+(g[i+1][1]-g[i][1])*t];if(inBB(p))pts.push(p)}}}
  // usuwanie zbędnych zapytań: punkt wewnątrz już znanej działki
  const P=new Map();let n=0;
  status(`Sieci: ${nets.length} odcinków. Sprawdzam działki w ULDK (${pts.length} punktów)…`,.1);
  await pool(pts,8,async p=>{const m=M(p);for(const d of P.values())if(inRings(m,d.rm))return;const d=await uldkXY(p[0],p[1]);if(!d||P.has(d.id))return;d.rings=wktRings(d.wkt);d.rm=d.rings.map(r=>r.map(M));P.set(d.id,d)},
    k=>{if(++n%10===0)status(`Sprawdzam działki w ULDK… ${k}/${pts.length} punktów, znaleziono ${P.size} działek`,.1+.85*k/pts.length)});
  // pomiar każdej sieci w każdej działce
  RES=[];
  for(const d of P.values()){
    const sieci=[];
    for(const nt of nets){if(nt.k==='nN'&&!useNn)continue;const g=nt.m;let len=0,maxd=0;
      for(let i=0;i<g.length-1;i++){const S=dist(g[i],g[i+1]);const s=Math.ceil(S);for(let k=0;k<s;k++){const q=[g[i][0]+(g[i+1][0]-g[i][0])*(k+.5)/s,g[i][1]+(g[i+1][1]-g[i][1])*(k+.5)/s];if(inRings(q,d.rm)){len+=S/s;maxd=Math.max(maxd,dRings(q,d.rm))}}}
      if(len>=1)sieci.push({id:nt.id,k:nt.k,kind:nt.kind,v:nt.t.voltage,op:nt.t.operator,len:Math.round(len),maxd:+maxd.toFixed(1)});
    }
    if(!sieci.length)continue;
    const domy=blds.filter(b=>inRings(b.c,d.rm));
    const domPrzyLinii=domy.some(b=>sieci.some(s=>s.k!=='nN'&&dLine(b.c,nets.find(x=>x.id===s.id).m)<40));
    const slupy=poles.some(p=>inRings(p,d.rm));
    let cx=0,cy=0;d.rm[0].forEach(p=>{cx+=p[0];cy+=p[1]});const cen=[cx/d.rm[0].length,cy/d.rm[0].length];
    const las=forests.some(f=>inRing(cen,f));
    RES.push({id:d.id,num:d.num,obr:d.obr,gm:d.gm,area:Math.round(areaM2(d.rings)),rings:d.rings,sieci,domy:domy.length,domPrzyLinii,slupy,las});
  }
  // budynki z oficjalnej bazy GUGiK (ULDK) przy liniach NN/WN i gazociągach: próbki co 25 m, 12 i 28 m w bok
  RES.forEach(score);
  const okP=RES.filter(r=>r.ok&&!r.las).map(r=>{const rm=r.rings.map(rg=>rg.map(M));const f=rm.flat();return{rm,x0:Math.min(...f.map(p=>p[0])),x1:Math.max(...f.map(p=>p[0])),y0:Math.min(...f.map(p=>p[1])),y1:Math.max(...f.map(p=>p[1]))}});
  const onOk=q=>okP.some(o=>q[0]>=o.x0&&q[0]<=o.x1&&q[1]>=o.y0&&q[1]<=o.y1&&inRings(q,o.rm));
  const bpts=[];
  for(const n of nets){if(!['NN','WN','gaz'].includes(n.k))continue;const g=n.m;
    for(let i=0;i<g.length-1;i++){const S=dist(g[i],g[i+1]);if(!S)continue;const ux=(g[i+1][0]-g[i][0])/S,uy=(g[i+1][1]-g[i][1])/S;const s=Math.max(1,Math.round(S/25));
      for(let k=0;k<s;k++){const x=g[i][0]+(g[i+1][0]-g[i][0])*(k+.5)/s,y=g[i][1]+(g[i+1][1]-g[i][1])*(k+.5)/s;for(const o of[-24,-9,9,24]){const q=[x-uy*o,y+ux*o];const ll=[q[0]/K.kx,q[1]/K.ky];if(inBB(ll)&&onOk(q))bpts.push({ll,net:n})}}}}

  status(`Szukam budynków przy liniach NN/WN i gazociągach w bazie GUGiK (${bpts.length} punktów)…`,.9);
  await pool(bpts,14,async p=>{const m=M(p.ll);for(const b of found.values())if(inRings(m,b.rm))return;
    const t=(await (await fetch(`https://uldk.gugik.gov.pl/?request=GetBuildingByXY&xy=${p.ll[0]},${p.ll[1]},4326&result=id,geom_wkt&srid=4326`)).text()).trim().split('\n');
    if(t[0]!=='0'||!t[1])return;const [bid,wkt]=t[1].split('|');if(found.has(bid))return;const rm=wktRings(wkt).map(r=>r.map(M));found.set(bid,{rm,net:p.net})},
    k=>{if(++bn%20===0)status(`Szukam budynków przy liniach… ${k}/${bpts.length}, znaleziono ${found.size}`,.9+.1*k/bpts.length)});
  for(const b of found.values()){let cx=0,cy=0;b.rm[0].forEach(p=>{cx+=p[0];cy+=p[1]});b.c=[cx/b.rm[0].length,cy/b.rm[0].length];b.d=dLine(b.c,b.net.m)}
  for(const r of RES){const rm=r.rings.map(rg=>rg.map(M));const bs=[...found.values()].filter(b=>inRings(b.c,rm));if(bs.length){r.domy=Math.max(r.domy,bs.length);const d=Math.min(...bs.map(b=>b.d));if(d<40){r.domPrzyLinii=true;r.domOdl=Math.round(d)}}}
  RES.forEach(score);render();loadResv();
  await enrichMpzp(RES.filter(r=>r.ok).sort((a,b)=>b.score-a.score).slice(0,40));
  status(`${label}: ${nets.length} odcinków sieci, ${RES.length} działek przeciętych przez sieć (${RES.filter(r=>r.ok).length} spełnia odległość od granicy).`,1);
  setTimeout(()=>$('#bar i').style.width='0',800);
}

// ---------- ocena wg zasad Votum ----------
const BUD=['MN','MW','PU','U','RM'];
function score(r){
  if(!r.sieci.length){r.u=store.get('u:'+r.id,{});r.score=0;r.ok=false;r.bud=false;r.prog=5;return}
  const u=store.get('u:'+r.id,{});r.u=u;
  const grunt=(u.grunt&&u.grunt!=='?')?u.grunt:(r.mpzpGrunt||'?');const bud=BUD.includes(grunt)||(grunt==='?'&&r.domy>0);
  const prog=BUD.includes(grunt)?5:(grunt==='?'?5:10);
  r.sieci.forEach(s=>s.ok=s.maxd>=prog);
  const good=r.sieci.filter(s=>s.ok);
  r.ok=good.length>0&&!(r.las&&grunt==='?')&&grunt!=='ZL';
  const typy=new Set(good.map(s=>s.k));
  let sc=good.reduce((a,s)=>a+TYPES[s.k].w*Math.min(s.len,400)/100,0);
  sc*=bud?1.8:1; if(typy.size>1)sc*=1+.35*(typy.size-1); if(r.domPrzyLinii)sc=sc*1.5+6; if(!r.ok)sc*=.2;
  r.score=Math.round(sc*10)/10;r.bud=bud;r.prog=prog;
}

// ---------- tryb: działki po numerze ----------
async function parcelByText(line,gm){
  const s=line.trim();if(!s)return [];
  const res='&result=id,parcel,region,commune,geom_wkt&srid=4326';
  let t;
  if(/^\d{6}_\d\.\d{4}\./.test(s))t=await (await fetch('https://uldk.gugik.gov.pl/?request=GetParcelById&id='+encodeURIComponent(s)+res)).text();
  else t=await (await fetch('https://uldk.gugik.gov.pl/?request=GetParcelByIdOrNr&id='+encodeURIComponent(s.replace(/\s+/g,' '))+res)).text();
  const l=t.trim().split(/\r?\n/);if(l[0].startsWith('-1'))return [];
  let rows=l.slice(1).filter(x=>x.includes('|')).map(x=>{const[id,num,obr,g,wkt]=x.split('|');return{id,num,obr,gm:g,wkt}});
  if(gm)rows=rows.filter(r=>(r.gm||'').toLowerCase().includes(gm.toLowerCase()))||rows;
  return rows;
}
async function buildingsInParcel(d){
  // siatka punktów co ~12 m wewnątrz działki → baza budynków GUGiK
  const xs=d.rm.flat().map(p=>p[0]),ys=d.rm.flat().map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let st=12;while(((x1-x0)/st)*((y1-y0)/st)>160)st*=1.4;
  const pts=[];for(let x=x0+st/2;x<x1;x+=st)for(let y=y0+st/2;y<y1;y+=st)if(inRings([x,y],d.rm))pts.push([x,y]);
  const found=new Map();
  await pool(pts,8,async q=>{for(const b of found.values())if(inRings(q,b.rm))return;
    const t=(await (await fetch(`https://uldk.gugik.gov.pl/?request=GetBuildingByXY&xy=${q[0]/K.kx},${q[1]/K.ky},4326&result=id,geom_wkt&srid=4326`)).text()).trim().split('\n');
    if(t[0]!=='0'||!t[1])return;const[bid,wkt]=t[1].split('|');if(found.has(bid))return;const rm=wktRings(wkt).map(r=>r.map(M));let cx=0,cy=0;rm[0].forEach(p=>{cx+=p[0];cy+=p[1]});found.set(bid,{rm,c:[cx/rm[0].length,cy/rm[0].length]})},()=>{});
  return [...found.values()];
}
async function checkNumbers(){
  const lines=$('#nrList').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  $('#nrPanel').hidden=true;$('#card').hidden=true;gPar.clearLayers();gPin.clearLayers();gNet.clearLayers();gArea.clearLayers();
  store.set('nrList',$('#nrList').value);store.set('nrGm',$('#nrGm').value);
  const P=[],miss=[];
  for(const [i,l] of lines.entries()){status(`Szukam działki ${l} w ULDK (${i+1}/${lines.length})…`,.05+.25*i/lines.length);
    try{const r=await parcelByText(l,$('#nrGm').value.trim());if(!r.length)miss.push(l);else if(r.length>3){miss.push(l+' (za dużo trafień, dopisz gminę)')}else P.push(...r)}catch(e){miss.push(l)}}
  if(!P.length)return status('Nie znalazłem: '+miss.join(', '),0);
  const all=P.flatMap(d=>wktRings(d.wkt).flat());const lat=all.reduce((a,p)=>a+p[1],0)/all.length;setK(lat);
  let bb={s:Math.min(...all.map(p=>p[1])),n:Math.max(...all.map(p=>p[1])),w:Math.min(...all.map(p=>p[0])),e:Math.max(...all.map(p=>p[0]))};
  const pad=.0015;bb={s:bb.s-pad,n:bb.n+pad,w:bb.w-pad*1.6,e:bb.e+pad*1.6};AREA=null;
  map.fitBounds([[bb.s,bb.w],[bb.n,bb.e]]);
  let nets=[],poles=[],osmOk=true;
  status('Pobieram sieci z OpenStreetMap dla tych działek…',.35);
  try{if((bb.n-bb.s)*(bb.e-bb.w)<0.01){const els=await overpass(bb,25000);for(const e of els){if(e.type==='node'){poles.push(M([e.lon,e.lat]));continue}if(!e.geometry)continue;const t=e.tags||{};if(t.building||t.landuse||t.natural)continue;const k=classify(t);if(!k)continue;const g=e.geometry.map(p=>[p.lon,p.lat]);nets.push({id:e.id,k,kind:kind(t),t,g,m:g.map(M)})}}else osmOk=false}catch(e){osmOk=false}
  NETS=nets;for(const n of nets)gNet.addLayer(L.polyline(n.g.map(([x,y])=>[y,x]),{color:col(n.k),weight:n.k==='NN'?5:n.k==='WN'?4:2.5,dashArray:n.kind==='podziemna'?'6 5':null}).bindTooltip(TYPES[n.k].n));
  if(!osmOk&&!map.hasLayer(kiut))kiut.addTo(map);
  RES=[];let i=0;
  for(const d of P){i++;status(`Sprawdzam budynki na działce ${d.num} w bazie GUGiK (${i}/${P.length})…`,.45+.5*i/P.length);
    d.rings=wktRings(d.wkt);d.rm=d.rings.map(r=>r.map(M));
    const sieci=[];
    for(const nt of nets){const g=nt.m;let len=0,maxd=0;for(let a=0;a<g.length-1;a++){const S=dist(g[a],g[a+1]);const s=Math.ceil(S);for(let k=0;k<s;k++){const q=[g[a][0]+(g[a+1][0]-g[a][0])*(k+.5)/s,g[a][1]+(g[a+1][1]-g[a][1])*(k+.5)/s];if(inRings(q,d.rm)){len+=S/s;maxd=Math.max(maxd,dRings(q,d.rm))}}}
      if(len>=1)sieci.push({id:nt.id,k:nt.k,kind:nt.kind,v:nt.t.voltage,op:nt.t.operator,len:Math.round(len),maxd:+maxd.toFixed(1)})}

// ---------- MPZP: symbol przeznaczenia z krajowej integracji planów (WMS GetFeatureInfo, EPSG:2180) ----------
function to2180(lat,lon){const a=6378137,f=1/298.257222101,e2=2*f-f*f,k0=0.9993,l0=19*Math.PI/180,φ=lat*Math.PI/180,λ=lon*Math.PI/180,ep2=e2/(1-e2),N=a/Math.sqrt(1-e2*Math.sin(φ)**2),T=Math.tan(φ)**2,C=ep2*Math.cos(φ)**2,A=(λ-l0)*Math.cos(φ);
  const Mx=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*φ-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*φ)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*φ)-(35*e2**3/3072)*Math.sin(6*φ));
  return [k0*(Mx+N*Math.tan(φ)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))-5300000,k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000]}
function symbolToGrunt(s){const m=String(s||'').toUpperCase().replace(/^[\d.\s]+/,'').match(/^[A-Z]+/);if(!m)return null;const x=m[0];
  if(/^(MN|MW|M)/.test(x))return x.startsWith('MW')?'MW':'MN';if(/^(PU|P|UP)/.test(x))return 'PU';if(/^RM/.test(x))return 'RM';if(/^U/.test(x))return 'U';if(/^ZL/.test(x))return 'ZL';if(/^R/.test(x))return 'R';if(/^Z/.test(x))return 'Z';return null}
async function mpzpAt(lat,lon){const[x,y]=to2180(lat,lon),d=40;
  const u='https://mapy.geoportal.gov.pl/wss/ext/KrajowaIntegracjaMiejscowychPlanowZagospodarowaniaPrzestrzennego?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetFeatureInfo&LAYERS=wektor-pow&QUERY_LAYERS=wektor-pow&CRS=EPSG:2180&BBOX='+[x-d,y-d,x+d,y+d].join(',')+'&WIDTH=81&HEIGHT=81&I=40&J=40&INFO_FORMAT=text/html&STYLES=&FORMAT=image/png';
  const t=await (await fetch(u,{signal:AbortSignal.timeout(20000)})).text();const doc=new DOMParser().parseFromString(t,'text/html');
  const th=[...doc.querySelectorAll('th')].map(e=>e.textContent.trim()),td=[...doc.querySelectorAll('td')].map(e=>e.textContent.trim());const i=th.indexOf('WR_SYMBOL');
  if(i<0||!td[i]||td[i]==='Null')return null;return{symbol:td[i],plan:td[th.indexOf('PLAN_ID')]||''}}
async function enrichMpzp(list){
  let n=0;await pool(list,6,async r=>{
    // punkt w środku działki najbliżej sieci: bierzemy środek ciężkości pierwszego pierścienia
    const rg=r.rings[0];let x=0,y=0;rg.forEach(p=>{x+=p[0];y+=p[1]});x/=rg.length;y/=rg.length;
    try{const m=await mpzpAt(y,x);r.mpzp=m?m.symbol:'';r.mpzpGrunt=m?symbolToGrunt(m.symbol):null}catch(e){r.mpzp=null}
  },k=>{if(++n%5===0)status(`Sprawdzam plany miejscowe (MPZP)… ${k}/${list.length}`,null)});
  RES.forEach(r=>r.sieci.length&&score(r));render();
}

function centroid(r){const rg=r.rings[0];let x=0,y=0;rg.forEach(p=>{x+=p[0];y+=p[1]});return[y/rg.length,x/rg.length]}
function navUrl(r){const[lat,lon]=centroid(r);return`https://www.google.com/maps/dir/?api=1&destination=${lat.toFixed(6)},${lon.toFixed(6)}`}
let ME=null,meMark=null;
function dMe(r){if(!ME)return 0;const[lat,lon]=centroid(r);return Math.hypot((lat-ME[0])*110540,(lon-ME[1])*111320*Math.cos(ME[0]*Math.PI/180))}
function locate(after){if(!navigator.geolocation)return status('Ten telefon nie udostępnia lokalizacji.',0);
  status('Ustalam Twoją lokalizację…',.2);
  navigator.geolocation.getCurrentPosition(p=>{ME=[p.coords.latitude,p.coords.longitude];
    if(meMark)map.removeLayer(meMark);meMark=L.circleMarker(ME,{radius:8,color:'#fff',weight:3,fillColor:'#1c6fd1',fillOpacity:1}).addTo(map).bindTooltip('Tu jesteś');
    map.setView(ME,Math.max(map.getZoom(),16));status('Lokalizacja ustalona.',1);setTimeout(()=>$('#bar i').style.width='0',600);after&&after()},
    e=>status('Nie udało się ustalić lokalizacji: '+(e.code===1?'brak zgody w przeglądarce.':e.message),0),{enableHighAccuracy:true,timeout:15000})}
const LocCtl=L.Control.extend({options:{position:'topleft'},onAdd(){const b=L.DomUtil.create('div','locbtn');b.title='Gdzie jestem';b.textContent='◎';L.DomEvent.on(b,'click',e=>{L.DomEvent.stop(e);locate()});return b}});
map.addControl(new LocCtl());
$('#fNear').onchange=()=>{if($('#fNear').checked&&!ME)locate(render);else render()};

$('#moreBtn').onclick=()=>{document.querySelector('header').classList.toggle('short');setTimeout(()=>map.invalidateSize(),50)};

// ---------- najbliższy adres (OpenStreetMap / Nominatim, 1 zapytanie na kartę, z pamięcią) ----------
async function fillAddr(r){const el=$('#addr');if(!el)return;const k='adr:'+r.id;let a=store.get(k,null);
  if(!a){try{const[lat,lon]=centroid(r);const j=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=${lat}&lon=${lon}`,{headers:{'Accept-Language':'pl'}})).json();
    const ad=j.address||{};a=[[ad.road,ad.house_number].filter(Boolean).join(' '),ad.village||ad.town||ad.city||ad.hamlet].filter(Boolean).join(', ')||'brak adresu w OSM';store.set(k,a)}catch(e){a=null}}
  if($('#addr')===el)el.textContent=a?'📍 Najbliższy adres (OSM, orientacyjnie): '+a:'📍 Adres niedostępny – użyj nawigacji do działki.'}


// ---------- link do działki (?dz=identyfikator) ----------
(()=>{const dz=new URLSearchParams(location.search).get('dz');if(!dz)return;store.set('demoSeen',true);
  setTimeout(()=>{$('#nrList').value=dz;$('#nrGm').value='';checkNumbers().then(()=>{const r=RES.find(x=>x.id===dz);if(r){map.fitBounds(L.polygon(r.rings.map(rg=>rg.map(([x,y])=>[y,x]))).getBounds(),{maxZoom:18});openCard(r)}}).catch(e=>status('Błąd: '+e.message,0))},300)})();

// ---------- CSV ----------
$('#csv').onclick=()=>{
  if(!RES.length)return status('Najpierw wyszukaj działki.');
  const h=['ranking','punkty','identyfikator','numer','obreb','gmina','pow_m2','sieci','glowna_kategoria','glowny_typ','dlugosc_m','max_od_granicy_m','spelnia','slupy_osm','budynki','dom_przy_linii','las_osm','typ_gruntu','cena_zl_m2','status','notatka','adres_osm','geoportal'];
  const rows=RES.slice().sort((a,b)=>b.score-a.score).map((r,i)=>{const m=r.sieci.slice().sort((a,b)=>TYPES[b.k].w-TYPES[a.k].w)[0]||{kind:'',k:null,len:'',maxd:''};const u=store.get('u:'+r.id,{});
    return[i+1,r.score,r.id,r.num,r.obr,r.gm,r.area,r.sieci.map(s=>`${s.k} ${s.len}m`).join(' + '),m.kind,m.k?TYPES[m.k].n:'',m.len,m.maxd,r.ok?'tak':'nie',r.slupy?'tak':'',r.domy,r.domPrzyLinii?'tak':'',r.las?'tak':'',u.grunt||'',u.cena||'',u.stat||'',(u.not||'').replace(/\n/g,' '),store.get('adr:'+r.id,''),`https://mapy.geoportal.gov.pl/imap/Imgp_2.html?identifyParcel=${r.id}`]});
  const csv='﻿'+[h,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`radar_${(AREA?.label||'obszar').replace(/\W+/g,'_')}.csv`;a.click();
};

// ---------- wyszukiwanie obszaru ----------
async function search(){
  try{
    status('Szukam miejscowości…',.02);
    const nq=async q=>(await fetch('https://nominatim.openstreetmap.org/search?countrycodes=pl&format=json&limit=1&q='+encodeURIComponent(q))).json();
    let j=await nq($('#q').value);if(!j.length&&$('#q').value.includes(','))j=await nq($('#q').value.split(',')[0]+', śląskie');if(!j.length)j=await nq($('#q').value.split(',')[0]);if(!j.length)return status('Nie znalazłem takiej miejscowości. Dopisz gminę, np. „Tuliszów, Siewierz”.',0);
    const lat=+j[0].lat,lon=+j[0].lon,R=+$('#rad').value;
    const dLat=R/110540,dLon=R/(111320*Math.cos(lat*Math.PI/180));
    const bb={s:lat-dLat,n:lat+dLat,w:lon-dLon,e:lon+dLon};
    map.fitBounds([[bb.s,bb.w],[bb.n,bb.e]]);store.set('last',$('#q').value);
    await run(bb,j[0].display_name.split(',')[0]);
  }catch(e){status('Błąd: '+e.message,0)}
}
$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};
$('#goView').onclick=()=>{const b=map.getBounds();if(map.getZoom()<13)return status('Przybliż mapę (obszar max ok. 5×5 km).');run({s:b.getSouth(),n:b.getNorth(),w:b.getWest(),e:b.getEast()},'Widok mapy').catch(e=>status('Błąd: '+e.message,0))};
const last=store.get('last',null);if(last)$('#q').value=last;
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
